<!doctype html>
<title>foo</title>
<head></head>
<link rel="stylesheet" href="styles.css">
<body>
  <h1>Rock, Paper, Scissors!</h1>
  <div class="sign-buttons">
    <button class="rock">🗿 </button>
  <button class="paper">📄</button>
  <button class="scissors">✂️</button>
  </div>
  <div class="stats">
    <div class="result">
    <h2>Round Results</h2>
    <div>
      The Human picked: <span class="human-choice"></span>
    </div>
    <div>
      The Computer picked: <span class="computer-choice"></span>
    </div>
    <div>
      Round winner: <span class="round-winner"></span>
    </div>
  </div>
  <div class="score">
    <h3>Scores</h3>
    <div>Human: <span class="human-score"></span></div>
    <div>Computer: <span class="computer-score"></span></div>
  </div>
  <div class="game-over">
    <div>
      Game Over! <span class="game-winner"> </span> won the game.
    </div>
    
   <div>
    <button class="reset-button">Reset</button>
   </div> 
  </div>
  </div>
  
</body>
<script src="script.js"></script>
